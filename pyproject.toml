[project]
name = "resume-generator"
version = "1.0.0"
description = "Веб-приложение на Flask для создания резюме в формате PDF"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
